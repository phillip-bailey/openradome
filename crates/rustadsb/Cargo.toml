[package]
name = "rustadsb"
description = "ADS-B and Mode S decoder command line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
rustadsb-core = { path = "../rustadsb-core" }
rtlsdr-nusb = "0.3.1"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
flate2 = "1.1.11"
ruzstd = "0.9.1"
toml = "1.2.3"
serde_json = "1.0.154"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }

# root filesystem statistics for the dashboard (already in the build through the USB driver)
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[lints]
workspace = true
